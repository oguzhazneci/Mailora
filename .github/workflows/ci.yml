# Mailora CI (14.8): her push'ta derle ve bütün testleri çalıştır.
name: CI

on:
  push:
  workflow_dispatch:          # Actions sekmesinden elle çalıştırma

# Aynı dala art arda push: eski çalıştırma iptal edilir (dakika kotası, Kavram 4)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Entegrasyon testleri için SQL Server (karar 3-A). Her çalıştırmada sıfırdan; iş bitince silinir.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Mailora_Test_123"     # sır değil: sadece bu geçici konteynere ait (Kavram 3)
        ports:
          - 1433:1433
        # SQL Server sorgu kabul etmeye hazır olana kadar adımlar başlamaz
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Mailora_Test_123 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      # MailoraAppFactory bu değişkeni görünce LocalDB yerine konteyneri kullanır (14.6.b)
      MAILORA_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=Mailora_Test_123;TrustServerCertificate=true"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Kodu al
        uses: actions/checkout@v7

      - name: .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Paketleri yükle
        run: dotnet restore

      - name: Derle
        run: dotnet build --no-restore --configuration Release

      - name: Testler
        run: dotnet test --no-build --configuration Release